appId: com.comfyui-asset-manager
productName: ComfyUI Asset Manager
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: comfyui-asset-manager
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
npmRebuild: true
publish:
  provider: github
  owner: woduseh
  repo: comfyui-asset-manager
